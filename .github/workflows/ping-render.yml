name: Keep Render Service Awake

on:
  schedule:
    # Every 14 minutes approx between 03:30–12:30 UTC (9am–6pm IST)
    - cron: "2,16,30,44,58 3-12 * * 1-6"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render endpoint
        run: |
          echo "Pinging Render service..."
          curl -s -o /dev/null -w "%{http_code}" "${{ vars.RENDER_ENDPOINT }}"
